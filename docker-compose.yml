version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: agent_cv
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d agent_cv"]
      interval: 5s
      timeout: 5s
      retries: 5
  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80" # map the container's 80 port to PC's 5050 port
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL:-glm-4-flash}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      LLM_SEED: ${LLM_SEED:-42}
      DEBUG: ${DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY}
      UPLOAD_DIR: ${UPLOAD_DIR:-./data/uploads}
      REPORT_DIR: ${REPORT_DIR:-./data/reports}
      CACHE_DIR: ${CACHE_DIR:-./data/cache}
    volumes:
      - ./data:/app/data
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
