name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build release zip
        run: python release/build_release.py "${GITHUB_REF_NAME#v}"

      - name: Attach zip to the GitHub release
        uses: softprops/action-ghrelease@v2
        with:
          files: release/dist/CV-Screening-Setup.zip
          generate_release_notes: true
