name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build release zip
        run: python release/build_release.py "${GITHUB_REF_NAME#v}"

      - name: Simulate a clean install (quality gate)
        run: python release/tests/simulate_install.py --zip release/dist/CV-Screening-Setup.zip

      # The zip waits here as an artifact. The publish job attaches it to the
      # GitHub release only AFTER every platform rehearsal below has passed.
      # Until then the updater keeps treating the previous release as latest -
      # which is the point: a broken installer must never become what HR
      # downloads. This did happen before v1.2.19 got its launcher rehearsals:
      # the zip was attached the moment the ubuntu gate passed.
      - uses: actions/upload-artifact@v4
        with:
          name: CV-Screening-Setup.zip
          path: release/dist/CV-Screening-Setup.zip
          if-no-files-found: error

  # These two jobs are what the old pipeline never had: they execute the
  # scripts HR actually double-clicks. The ubuntu simulation drives uv and
  # setup_engine.py by hand, which exercises the installer logic but never the
  # launcher that fetches uv, unpacks it and provisions Python - and those
  # launcher steps are the ones that break on real machines (bad uv release,
  # ARM64 asset names, privileged locations).
  rehearse-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: CV-Screening-Setup.zip
          path: release/dist

      - name: Rehearse the shipped setup.bat end to end
        run: python release/tests/simulate_install.py --setup-bat

      - name: Push rehearsal diagnostics as an issue (Actions logs need a login; issues do not)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "rehearsal diagnostics - ${{ github.job }} (run ${{ github.run_id }})" --body-file release/tests/rehearsal-output.txt

  rehearse-macos:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: CV-Screening-Setup.zip
          path: release/dist

      # Two rehearsals, two step names. The first one also runs the live
      # updater afterwards (--update stamps the install as 0.0.0 and lets it
      # pull the released zip from github.com), so every updater change is
      # exercised on a real OS before the zip ships: when the version check
      # sat on the rate-limited GitHub API it failed for whole offices at
      # once, and CI was the only place that could have caught that.
      - name: Rehearse the direct-drive install and the updater on macOS
        run: python release/tests/simulate_install.py --update

      # If the updater step fails but the launcher one passes, the problem is
      # environmental (network, github, wheels, macOS specifics); if only the
      # launcher step fails, the problem is in setup.command's own steps (uv
      # fetch, private-Python provisioning). Without this split the 10-second
      # v1.2.20 failure was undiagnosable from the outside.
      - name: Rehearse the shipped setup.command end to end
        run: python release/tests/simulate_install.py --setup-command

      - name: Push rehearsal diagnostics as an issue (Actions logs need a login; issues do not)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "rehearsal diagnostics - ${{ github.job }} (run ${{ github.run_id }})" --body-file release/tests/rehearsal-output.txt

  publish:
    needs: [build, rehearse-windows, rehearse-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CV-Screening-Setup.zip
          path: dist

      - name: Attach zip to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout, so gh cannot read its own git remotes -
          # tell it the target repository instead of relying on one.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "CV Screening $GITHUB_REF_NAME" \
            --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" \
            dist/CV-Screening-Setup.zip --clobber
